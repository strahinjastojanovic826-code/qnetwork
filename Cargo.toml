[package]
name = "qnetwork"
version = "0.5.0"
edition = "2021"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]
description = "A quaternary (2-bit) network protocol library with FEC, stream decoding, and packet framing."
license = "AGPL-3.0-only"
repository = "https://github.com/strahinjastojanovic826-code/qnetwork"
keywords = ["network", "quaternary", "serialization", "fec", "compression"]
categories = ["network-programming", "encoding", "data-structures"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }